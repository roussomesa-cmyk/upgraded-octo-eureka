name: Fuel Monitor Automation
on:
  workflow_dispatch:
jobs:
  run-fuel-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon gspread google-auth pandas requests
      - name: Run Fuel Monitor Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SPREADSHEET_ID: ${{ secrets.REPORT_SPREADSHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          STATION_GROUP_ID: ${{ secrets.STATION_GROUP_ID }}
          FUEL_ALERT_GROUP_ID: ${{ secrets.FUEL_ALERT_GROUP_ID }}
        run: python fuel_monitor.py
