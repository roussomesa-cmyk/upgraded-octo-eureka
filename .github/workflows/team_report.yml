name: Run Team Pass Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select Mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - final
      week_num:
        description: 'Week number (for weekly mode: 1-4)'
        required: false
        default: '2'
        type: string

concurrency:
  group: telegram-team   # Session ផ្ទាល់ខ្លួន: បូតតែមួយមិនរត់ពីរព្រមគ្នា
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ស្តារប្រវត្តិ Approved ដែលបានឃើញ (ចាប់តាមថ្ងៃនីមួយៗ)
      - name: Restore team pass state
        uses: actions/cache/restore@v4
        with:
          path: team_pass_state.json
          key: team-pass-state-${{ github.run_id }}
          restore-keys: |
            team-pass-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (for dataframe_image & Khmer fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-khmeros chromium-browser chromium-chromedriver

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests dataframe_image telethon

      - name: Run Python script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          NOTIFY_GROUP_ID: ${{ secrets.NOTIFY_GROUP_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION_TEAM }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "weekly" ]; then
            python team_pass_report.py weekly --week ${{ github.event.inputs.week_num }}
          else
            python team_pass_report.py ${{ github.event.inputs.mode }}
          fi

      - name: Save team pass state
        if: always() && hashFiles('team_pass_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: team_pass_state.json
          key: team-pass-state-${{ github.run_id }}
