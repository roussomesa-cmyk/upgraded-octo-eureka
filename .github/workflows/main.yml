name: Daily Report Summary

on:
  schedule:
    # ម៉ោង ១៧:00 (5 ល្ងាច) ម៉ោងកម្ពុជា (UTC+7) = 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch: {}

concurrency:
  group: telegram-userbot   # ដូចគ្នានឹង check_sites.yml ដើម្បីកុំឲ្យរត់ព្រមគ្នាលើគណនី Telegram តែមួយ
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon gspread google-auth
- name: Run report summary
        run: python report_summary.py
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          REPORT_SPREADSHEET_ID: ${{ secrets.REPORT_SPREADSHEET_ID }}
          REPORT_NOTIFY_GROUP_ID: ${
      
