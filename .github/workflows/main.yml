name: Daily Report Automation

on:
  schedule:
    # ម៉ោង 6:30 AM កម្ពុជា (UTC 11:30 PM ថ្ងៃមុន)
    - cron: '30 23 * * *'
    # ម៉ោង 4:30 PM កម្ពុជា (UTC 9:30 AM)
    - cron: '30 9 * * *'
  workflow_dispatch: # សម្រាប់ចុច Test ផ្ទាល់ដៃ

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon gspread google-auth pandas dataframe_image html2image requests
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Run Report Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          NOTIFY_GROUP_ID: ${{ secrets.NOTIFY_GROUP_ID }}
        run: python report_summary.py
