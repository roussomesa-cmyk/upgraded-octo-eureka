name: Daily Report Automation

on:
  schedule:
    # GitHub (free) ចាប់ផ្តើមយឺតមិនទៀង → ចាប់ផ្តើមមុនម៉ោង ហើយស្គ្រីបរង់ចាំដល់ SEND_AT មុនផ្ញើ
    # ជៀសវាងនាទី :00 / :30 ព្រោះមនុស្សច្រើនប្រើ ទើបយឺតជាង
    - cron: '43 23 * * *'   # 06:43 ម៉ោងកម្ពុជា (មេ)
    - cron: '13 0 * * *'    # 07:13 ម៉ោងកម្ពុជា (បម្រុង ប្រសិនបើមេមិនដំណើរការ)
  workflow_dispatch:
    inputs:
      source:
        description: 'cron = ហៅស្វ័យប្រវត្តិពី cron ខាងក្រៅ / manual = ដោយដៃ'
        required: false
        default: 'manual'

# កុំឱ្យ ២ ដំណើរការរត់ព្រមគ្នា (បម្រុងនឹងរង់ចាំមេចប់ ហើយរំលងដោយខ្លួនឯង)
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ស្តារប្រវត្តិពិន្ទុ ដោយសារ GitHub Actions ប្រើម៉ាស៊ីនថ្មីរាល់ដំណើរការ
      - name: Restore weekly warning state
        uses: actions/cache/restore@v4
        with:
          path: weekly_warning_state.json
          key: weekly-warning-state-${{ github.run_id }}
          restore-keys: |
            weekly-warning-state-

      - name: Initialize warning state if no saved state exists
        run: test -f weekly_warning_state.json || printf '{}\n' > weekly_warning_state.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon gspread google-auth pandas dataframe_image html2image requests python-docx
          # ប្រើ Google Chrome ដែលមានស្រាប់លើ ubuntu-latest (កុំ apt install chromium-browser ព្រោះវាទាញ snap ធំ ហើយយឺតខ្លាំង)
          google-chrome --version

      - name: Install Khmer fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-khmeros
          fc-cache -f
          fc-list | grep -i khmer | head -5

      - name: Run Report Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SPREADSHEET_ID: ${{ secrets.REPORT_SPREADSHEET_ID }}
          NOTIFY_GROUP_ID: ${{ secrets.REPORT_NOTIFY_GROUP_ID }}
          RUN_SOURCE: ${{ github.event.inputs.source }}
          SEND_AT: '07:30'   # ម៉ោងផ្ញើ (ម៉ោងកម្ពុជា) — សម្រាប់ដំណើរការតាម schedule ប៉ុណ្ណោះ
          # START_DATE ត្រូវលុបចេញ: ស្គ្រីបគណនាសប្តាហ៍ស្វ័យប្រវត្តិ
        run: python report_summary.py

      # រក្សាទុកប្រវត្តិ ដើម្បីប្រើក្នុងការដំណើរការលើកក្រោយ
      - name: Save weekly warning state
        if: always() && hashFiles('weekly_warning_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: weekly_warning_state.json
          key: weekly-warning-state-${{ github.run_id }}
