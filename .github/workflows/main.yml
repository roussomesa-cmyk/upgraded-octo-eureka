name: Daily Report Automation

on:
  schedule:
    # ម៉ោង 7:30 ព្រឹក ម៉ោងកម្ពុជា (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ស្តារប្រវត្តិពិន្ទុ ដោយសារ GitHub Actions ប្រើម៉ាស៊ីនថ្មីរាល់ដំណើរការ
      - name: Restore weekly warning state
        uses: actions/cache/restore@v4
        with:
          path: weekly_warning_state.json
          key: weekly-warning-state-${{ github.run_id }}
          restore-keys: |
            weekly-warning-state-

      - name: Initialize warning state if no saved state exists
        run: test -f weekly_warning_state.json || printf '{}\n' > weekly_warning_state.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon gspread google-auth pandas dataframe_image html2image requests python-docx
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install Khmer fonts
        run: |
          sudo apt-get install -y fonts-noto-core fonts-khmeros
          fc-cache -f
          fc-list | grep -i khmer | head -5

      - name: Run Report Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SPREADSHEET_ID: ${{ secrets.REPORT_SPREADSHEET_ID }}
          NOTIFY_GROUP_ID: ${{ secrets.REPORT_NOTIFY_GROUP_ID }}
          START_DATE: '2026-11-02'
        run: python report_summary.py

      # រក្សាទុកប្រវត្តិ ដើម្បីប្រើក្នុងការដំណើរការលើកក្រោយ
      - name: Save weekly warning state
        if: always() && hashFiles('weekly_warning_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: weekly_warning_state.json
          key: weekly-warning-state-${{ github.run_id }}
